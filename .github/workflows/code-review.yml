# Module 1 + Module 5 — CI/CD trigger.
#
# On every pull request this workflow computes the PR's diff, runs Semgrep on the
# code, then reviews the change (Modules 1-4) and posts the result back onto the
# PR as inline + summary comments (Module 5).
#
# The AI reviewer (Module 2) is optional: set the repo variable AI_MODEL_PATH to
# the fine-tuned model (a Hugging Face id or path) to turn it on. Without it, the
# workflow still posts the Semgrep security review.

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write      # needed to post review comments

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0     # full history so we can diff against the base branch

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install semgrep

      - name: Compute the PR diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          git diff "origin/$BASE_REF...HEAD" > change.diff
          echo "Diff size: $(wc -l < change.diff) lines"

      - name: Run Semgrep security scan
        # Semgrep exits 1 when it finds issues; that is expected, so don't fail here.
        run: |
          # Keep this list identical to DEFAULT_CONFIGS in
          # backend/app/security/semgrep_scanner.py (a test checks they match).
          semgrep --json --quiet \
            --config p/python --config p/javascript \
            --config p/owasp-top-ten --config p/secrets \
            --config p/security-audit --config p/expressjs --config p/gitleaks \
            --config r/javascript.browser.security.eval-detected.eval-detected \
            --config r/javascript.lang.security.audit.sqli.node-mysql-sqli.node-mysql-sqli \
            --config r/python.lang.security.audit.exec-detected.exec-detected \
            --config r/python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query \
            --config r/python.lang.security.audit.formatted-sql-query.formatted-sql-query \
            --config r/python.flask.security.xss.audit.explicit-unescape-with-markup.explicit-unescape-with-markup \
            --config backend/app/security/rules \
            --output semgrep.json . || true

      - name: Review and post comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL_PATH: ${{ vars.AI_MODEL_PATH }}   # optional; enables Module 2
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}  # optional; saves reviews to Postgres
        run: |
          python scripts/run_review.py \
            --diff change.diff \
            --semgrep semgrep.json \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --commit "$HEAD_SHA" \
            --author "$PR_AUTHOR"
